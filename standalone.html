                        className="bg-white rounded-2xl p-2.5 flex items-center justify-center aspect-square shadow-lg hover:scale-105 transition-transform border border-white/20"
                        title={client.name}
                      >
                        <img
                          src={client.logo}
                          alt={client.name}
                          className="max-h-full max-w-full object-contain"
                        />
                      </div>
                    ))}
                  </div>

                  {/* Engine Makes Strip */}
                  <div className="mt-8 pt-6 border-t border-slate-800/80">
                    <div className="text-center mb-4 text-xs font-bold uppercase tracking-wider text-slate-400">
                      Supported Engine Makes & Control System Manufacturers
                    </div>
                    <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3">
                      {BRANDS.map((b, i) => (
                        <div key={i} className="p-3 bg-slate-900 rounded-xl border border-white/5 flex items-center justify-center hover:border-orange-500/40 transition-colors">
                          <img src={b.logo} alt={b.name} className="h-7 w-full object-contain" />
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* After-Sales Services We Offer */}
          <section id="services" className="py-16 bg-[#050b17]">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center max-w-3xl mx-auto mb-14">
                <div className="inline-flex items-center gap-2 mb-3">
                  <span className="w-8 h-0.5 bg-orange-500 rounded-full"></span>
                  <span className="text-xs uppercase font-extrabold tracking-widest text-orange-400">OUR SERVICES</span>
                  <span className="w-8 h-0.5 bg-orange-500 rounded-full"></span>
                </div>
                <h2 className="font-montserrat font-black text-3xl sm:text-4xl text-white tracking-tight mb-3">
                  Repair &bull; Maintenance &bull; Service
                </h2>
                <p className="text-slate-300 text-sm sm:text-base">
                  Delivering dependable technical support across all Maldives atolls with 28 years of uninterrupted excellence.
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
                {SERVICES.map((s) => (
                  <div key={s.id} className="bg-[#09152e]/70 border border-slate-800 hover:border-orange-500/50 rounded-2xl p-6 transition-all flex flex-col justify-between">
                    <div>
                      <div className="w-12 h-12 rounded-xl bg-orange-500/10 border border-orange-500/30 flex items-center justify-center mb-4 text-orange-400 text-xl">
                        <i className={s.icon}></i>
                      </div>
                      <h3 className="font-montserrat font-bold text-lg text-white mb-2">{s.title}</h3>
                      <p className="text-slate-300 text-xs leading-relaxed mb-4">{s.shortDesc}</p>
                      <div className="space-y-1.5 mb-6">
                        {s.features.slice(0, 3).map((f, i) => (
                          <div key={i} className="flex items-center gap-2 text-xs text-slate-300">
                            <i className="fa-solid fa-check text-orange-400 text-[10px]"></i>
                            <span>{f}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                    <div className="pt-3 border-t border-slate-800 flex justify-between items-center">
                      <button onClick={() => setSelectedService(s)} className="text-xs font-bold text-orange-400 hover:text-orange-300">
                        Details &rarr;
                      </button>
                      <button onClick={() => handleOpenQuote(s.title)} className="text-xs font-bold px-3 py-1 rounded bg-orange-500 text-white">
                        Book Service
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Contact Section */}
          <section id="contact" className="py-16 bg-[#071022]">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-10">
                <div className="lg:col-span-5">
                  <h2 className="font-montserrat font-black text-3xl text-white mb-4">
                    Ready to Power Up Your Operations?
                  </h2>
                  <p className="text-slate-300 text-sm mb-6">
                    Fill out the form and our technical response team will immediately review your request and call you. Submissions are delivered to <strong>{TARGET_EMAIL}</strong>.
                  </p>
                  <div className="space-y-3 text-sm">
                    <div className="p-3 rounded-xl bg-slate-900 border border-slate-800">
                      <div className="text-xs uppercase text-slate-400 font-bold">24/7 Hotline</div>
                      <div className="text-lg font-montserrat font-black text-orange-400">{COMPANY_INFO.phone}</div>
                    </div>
                    <div className="p-3 rounded-xl bg-slate-900 border border-slate-800">
                      <div className="text-xs uppercase text-slate-400 font-bold">Email Dispatch</div>
                      <div className="text-sm font-bold text-white">{TARGET_EMAIL}</div>
                    </div>
                    <div className="p-3 rounded-xl bg-slate-900 border border-slate-800">
                      <div className="text-xs uppercase text-slate-400 font-bold">Service Area</div>
                      <div className="text-sm font-bold text-white">Across All Maldives Islands & Atolls</div>
                    </div>
                  </div>
                </div>

                {/* 16 Client Logos Grid */}
                <div className="mt-12 pt-8 border-t border-slate-800">
                  <div className="text-center mb-6">
                    <span className="text-xs font-bold uppercase tracking-widest text-orange-400">
                      Our Prestigious Clients & Institutional Partners
                    </span>
                    <h3 className="font-montserrat font-black text-xl sm:text-2xl text-white mt-1">
                      Trusted Across Sri Lanka & Maldives
                    </h3>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3">
                    {CLIENT_LOGOS.map((client, idx) => (
                      <div
                        key={idx}
                        className="bg-white rounded-2xl p-2.5 flex items-center justify-center aspect-square shadow-lg hover:scale-105 transition-transform border border-white/20"
                        title={client.name}
                      >
                        <img
                          src={client.logo}
                          alt={client.name}
                          className="max-h-full max-w-full object-contain"
                        />
                      </div>
                    ))}
                  </div>

                  {/* Engine Makes Strip */}
                  <div className="mt-8 pt-6 border-t border-slate-800/80">
                    <div className="text-center mb-4 text-xs font-bold uppercase tracking-wider text-slate-400">
                      Supported Engine Makes & Control System Manufacturers
                    </div>
                    <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3">
                      {BRANDS.map((b, i) => (
                        <div key={i} className="p-3 bg-slate-900 rounded-xl border border-white/5 flex items-center justify-center hover:border-orange-500/40 transition-colors">
                          <img src={b.logo} alt={b.name} className="h-7 w-full object-contain" />
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-7">
                  <div className="bg-[#09152e] border border-slate-800 rounded-2xl p-6 sm:p-8">
                    <h3 className="font-montserrat font-bold text-xl text-white mb-4">Confirm Technical Request</h3>
                    <form onSubmit={(e) => handleFormSubmit(e, 'Contact Inquiry')} className="space-y-4">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Your Name *</label>
                          <input name="Name" required type="text" placeholder="Manager / Captain" className="w-full px-3 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white text-sm" />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Phone / WhatsApp *</label>
                          <input name="Phone" required type="tel" placeholder="+960 7XXXXXX" className="w-full px-3 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white text-sm" />
                        </div>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Service Required *</label>
                          <select name="Service" required className="w-full px-3 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white text-sm">
                            {SERVICES.map(s => <option key={s.id} value={s.title}>{s.title}</option>)}
                            <option value="Genuine Spare Parts Supply">Genuine Spare Parts Supply</option>
                            <option value="Emergency Breakdown Repair">Emergency Breakdown Repair</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Atoll Location *</label>
                          <select name="Atoll" required className="w-full px-3 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white text-sm">
                            {MALDIVES_ATOLLS.map((a, i) => <option key={i} value={a}>{a}</option>)}
                          </select>
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Details / Requirements</label>
                        <textarea name="Details" rows="3" placeholder="Provide machine make, symptoms or parts needed..." className="w-full px-3 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white text-sm"></textarea>
                      </div>
                      <button type="submit" disabled={sendingQuote} className="w-full py-3.5 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 font-montserrat font-bold text-sm text-white shadow-lg">
                        {sendingQuote ? `Sending to ${TARGET_EMAIL}...` : "Confirm Service Request"}
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer className="bg-[#030712] text-slate-400 border-t border-orange-500/20 py-8 text-xs text-center">
            <div className="max-w-7xl mx-auto px-4">
              <p className="text-slate-300 mb-2">&copy; 2025 SL TEC – Total Technical Solution. All rights reserved. Powering Maldives &bull; Every Island 🇲🇻</p>
              <p className="text-slate-500">Inquiries sent directly to: <span className="text-orange-400">{TARGET_EMAIL}</span> | Hotline: 7370267</p>
            </div>
          </footer>

          {/* Quote Modal */}
          {isQuoteOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="relative w-full max-w-xl bg-[#081329] border border-orange-500/40 rounded-3xl p-6 sm:p-8 shadow-2xl">
                <button onClick={() => setIsQuoteOpen(false)} className="absolute top-5 right-5 text-slate-400 hover:text-white">
                  <i className="fa-solid fa-xmark text-xl"></i>
                </button>
                <div className="flex items-center gap-2 mb-2">
                  <i className="fa-solid fa-bolt text-orange-400"></i>
                  <h3 className="font-montserrat font-bold text-2xl text-white">Request a Service or Quote</h3>
                </div>
                <p className="text-xs text-slate-400 mb-4">Direct dispatch to <strong>{TARGET_EMAIL}</strong></p>

                <form onSubmit={(e) => handleFormSubmit(e, 'Modal Service Request')} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Your Name *</label>
                    <input name="Name" required type="text" placeholder="Chief Engineer / Manager" className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Phone / WhatsApp *</label>
                    <input name="Phone" required type="tel" placeholder="+960 7XXXXXX" className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Service Needed *</label>
                    <select name="Service" defaultValue={quotePrefill || 'All Types of Generators'} className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm">
                      {SERVICES.map(s => <option key={s.id} value={s.title}>{s.title}</option>)}
                      <option value="Genuine Spare Parts Supply">Genuine Spare Parts Supply</option>
                      <option value="Emergency Breakdown Repair">Emergency Breakdown Repair</option>
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Atoll *</label>
                      <select name="Atoll" required className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm">
                        {MALDIVES_ATOLLS.map((a, i) => <option key={i} value={a}>{a}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Island / Vessel</label>
                      <input name="Island_Vessel" placeholder="Resort or Safari Vessel" className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Problem Details</label>
                    <textarea name="Details" rows="3" placeholder="Symptoms, generator capacity (kVA), or part required..." className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm"></textarea>
                  </div>
                  <button type="submit" disabled={sendingQuote} className="w-full py-3 rounded-xl bg-orange-500 hover:bg-orange-600 font-bold text-white text-sm shadow-lg">
                    {sendingQuote ? `Sending to ${TARGET_EMAIL}...` : "Confirm Service Request"}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed top-6 right-6 z-50 max-w-md bg-[#09152e] border-2 border-orange-500 rounded-2xl p-4 shadow-2xl flex items-center gap-3">
              <i className="fa-solid fa-circle-check text-orange-400 text-xl"></i>
              <div className="text-xs text-white flex-1">{toastMsg}</div>
              <button onClick={() => setToastMsg(null)} className="text-slate-400 hover:text-white">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
